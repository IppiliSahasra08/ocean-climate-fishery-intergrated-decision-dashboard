<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-container">
        <header class="dashboard-header">
            <div>
                <h1 id="ocean-title">Ocean Data Dashboard</h1>
                <p>Real-time monitoring and fish tracking</p>
            </div>
            <a href="index.html" class="back-btn">← Back to Globe</a>
        </header>

        <!-- Stats Row -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Recorded Species</div>
                <div class="stat-number">1,245</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Avg Temperature</div>
                <div class="stat-number">24°C</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Active Sensors</div>
                <div class="stat-number">42</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Depth Mapped</div>
                <div class="stat-number">85%</div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="content-section">
            <h2>Fish Species in this Region</h2>
            <p>Data visualization placeholder. Your backend data would populate this area.</p>
            <br>
            <div style="background: #222; height: 300px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: #555;">
                [ CHART / MAP COMPONENT ]
            </div>
        </div>
    </div>

    <script>
        // Get the ocean name from the URL query parameter
        const urlParams = new URLSearchParams(window.location.search);
        const oceanName = urlParams.get('ocean');

        if (oceanName) {
            document.getElementById('ocean-title').innerText = oceanName + " Dashboard";
            document.title = oceanName + " - Dashboard";
        }
    </script>

</body>
</html>
