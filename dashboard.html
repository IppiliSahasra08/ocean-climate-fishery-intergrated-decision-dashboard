<!DOCTYPE html>
<html>

<head>
    <title>Ocean Sustainability Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #1a4e8a;
            --bg: #f3f6fa;
            --card-bg: #ffffff;
            --accent: #3498db;
            --text: #2c3e50;
            --danger: #e74c3c;
            --warning: #f39c12;
            --success: #2ecc71;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 30px;
            font-weight: 700;
        }

        .controls {
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        select {
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        select:focus {
            border-color: var(--accent);
        }

        button {
            padding: 12px 25px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
        }

        button:hover {
            background: #143d6b;
            transform: translateY(-2px);
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease;
            text-align: center;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            margin: 0 0 10px 0;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7f8c8d;
        }

        .card p {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
        }

        .chart-container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            margin-bottom: 40px;
        }

        .info-section {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            text-align: left;
        }

        .info-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .info-card h2 {
            margin-top: 0;
            color: var(--primary);
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        #risk-level {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 1rem;
        }

        .risk-Low {
            background: #d4efdf;
            color: #1e8449;
        }

        .risk-Moderate {
            background: #fef5e7;
            color: #d68910;
        }

        .risk-High {
            background: #f9ebea;
            color: #a93226;
        }

        #recommendation {
            line-height: 1.6;
            color: #34495e;
            font-size: 1.1rem;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🌊 Ocean Sustainability Dashboard</h1>

        <div class="controls">
            <select id="region">
                <option value="bay_of_bengal">Bay of Bengal</option>
                <option value="north_atlantic">North Atlantic</option>
                <option value="eastern_pacific">Eastern Pacific</option>
            </select>
            <button onclick="loadData()">Fetch Live Data</button>
        </div>

        <div class="cards">
            <div class="card">
                <h3>SST</h3>
                <p id="sst">--</p>
            </div>
            <div class="card">
                <h3>Oxygen</h3>
                <p id="oxygen">--</p>
            </div>
            <div class="card">
                <h3>Fish Stock</h3>
                <p id="fish">--</p>
            </div>
            <div class="card">
                <h3>Catch</h3>
                <p id="catch">--</p>
            </div>
            <div class="card">
                <h3>Score</h3>
                <p id="score">--</p>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="chart"></canvas>
        </div>

        <div class="info-section">
            <div class="info-card">
                <h2>Risk Level</h2>
                <span id="risk-level">--</span>
            </div>
            <div class="info-card">
                <h2>Policy Recommendation</h2>
                <p id="recommendation">Select a region to see recommendations...</p>
            </div>
        </div>
    </div>

    <script>
        let chart;

        async function loadData() {
            const region = document.getElementById("region").value;
            const btn = document.querySelector("button");
            btn.innerText = "Loading...";
            btn.disabled = true;

            try {
                const res = await fetch(`http://127.0.0.1:8000/region-data?region=${region}&live=true`);
                const data = await res.json();

                // Update text fields
                document.getElementById("sst").innerText = data.indicators.sst.toFixed(1) + "°C";
                document.getElementById("oxygen").innerText = data.indicators.oxygen.toFixed(1) + " mg/L";
                document.getElementById("fish").innerText = Math.round(data.indicators.fish_stock).toLocaleString();
                document.getElementById("catch").innerText = Math.round(data.indicators.catch).toLocaleString();
                document.getElementById("score").innerText = data.sustainability_score.toFixed(1);

                const riskEl = document.getElementById("risk-level");
                riskEl.innerText = data.risk_level;
                riskEl.className = `risk-${data.risk_level}`;

                document.getElementById("recommendation").innerText = data.recommendation;

                // Update Chart
                const labels = ['SST (°C)', 'Oxygen (mg/L)', 'Fish Stock (k)', 'Catch (k)', 'Score'];
                const values = [
                    data.indicators.sst,
                    data.indicators.oxygen,
                    data.indicators.fish_stock / 10, // Scaled for visibility
                    data.indicators.catch / 5,      // Scaled for visibility
                    data.sustainability_score
                ];

                if (chart) chart.destroy();

                const ctx = document.getElementById("chart").getContext('2d');
                chart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Regional Metrics',
                            data: values,
                            backgroundColor: [
                                'rgba(231, 76, 60, 0.7)',
                                'rgba(52, 152, 219, 0.7)',
                                'rgba(46, 204, 113, 0.7)',
                                'rgba(241, 196, 15, 0.7)',
                                'rgba(155, 89, 182, 0.7)'
                            ],
                            borderColor: [
                                '#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#9b59b2'
                            ],
                            borderWidth: 2,
                            borderRadius: 8
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                grid: { color: 'rgba(0,0,0,0.05)' }
                            },
                            x: {
                                grid: { display: false }
                            }
                        }
                    }
                });
            } catch (error) {
                console.error("Error loading data:", error);
                alert("Failed to load live data. Check if backend is running.");
            } finally {
                btn.innerText = "Fetch Live Data";
                btn.disabled = false;
            }
        }
    </script>

</body>

</html>
